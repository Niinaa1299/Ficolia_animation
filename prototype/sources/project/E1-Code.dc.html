<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<title>Ficolia — Saisir le code-barres</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;background:#FFFFFF;color:#321C31;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
a,button{touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform 160ms ease-out}
a:active,button:active{transform:scale(0.97)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #4C2944;outline-offset:3px}
@media (prefers-reduced-motion:reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #321C31; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 50px 20px 0 20px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
<a href="E1-Scan.dc.html" aria-label="Retour au scan" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #E7E1DA; background: #FAF8F4; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4C2944" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; text-align: center; font-size: 19px; font-weight: 700">Saisir le code-barres</h1>
<span></span>
</div>
<!-- Saisie guidée (porteuse, 25/11, fil 68e27871 : « si code pas reconnu ou typologie pas respectée du code barre à mentionner. guider l'inscription ») : le nombre de chiffres attendus, le compte en direct, un message si la longueur ou la clé de contrôle ne va pas ; un code valide mais inconnu mène à « Nous ne connaissons pas ce produit ». Textes : Proposition. -->
<div style="padding: 32px 24px 0 24px; display: flex; flex-direction: column; gap: 10px">
<label for="e1-code" style="font-size: 17px; font-weight: 700">Code-barres</label>
<input id="e1-code" type="text" inputmode="numeric" autocomplete="off" maxlength="20" value="{{code}}" sc-camel-on-change="{{onCode}}" aria-describedby="e1-code-aide e1-code-erreur" aria-invalid="{{invalide}}" style="box-sizing: border-box; width: 100%; min-height: 56px; padding: 0 16px; border: {{bord}}; border-radius: 16px; background: #FFFFFF; color: #321C31; font-family: inherit; font-size: 22px; letter-spacing: 0.04em">
<p id="e1-code-aide" style="margin: 0; font-size: 14px; line-height: 1.4; color: #6E5A6B">Les 8, 12 ou 13 chiffres imprimés sous le code-barres.{{compte}}</p>
<sc-if value="{{erreur}}" hint-placeholder-val="{{ false }}">
<p id="e1-code-erreur" role="alert" style="margin: 0; padding: 12px 14px; border: 1.5px solid #6E5A6B; border-radius: 14px; background: #FAF8F4; font-size: 16px; line-height: 1.45">{{message}}</p>
</sc-if>
<sc-if value="{{showStatus}}" hint-placeholder-val="{{ true }}">
<span style="align-self: flex-start; padding: 3px 10px; border: 1px dashed #6E5A6B; border-radius: 999px; font-size: 13px; line-height: 1.3; color: #6E5A6B">Proposition</span>
</sc-if>
</div>
<div style="padding: 24px 24px 0 24px; display: flex; flex-direction: column">
<sc-if value="{{connu}}" hint-placeholder-val="{{ false }}">
<a href="E1-Produit.dc.html" style="align-self: stretch; min-height: 56px; border-radius: 999px; background: #4C2944; color: #FFF7F0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Voir le produit</a>
</sc-if>
<sc-if value="{{inconnu}}" hint-placeholder-val="{{ false }}">
<a href="E3-SansVerdict-Inconnu.dc.html" style="align-self: stretch; min-height: 56px; border-radius: 999px; background: #4C2944; color: #FFF7F0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Voir le produit</a>
</sc-if>
<sc-if value="{{aVerifier}}" hint-placeholder-val="{{ true }}">
<button type="button" sc-camel-on-click="{{verifier}}" style="align-self: stretch; min-height: 56px; border: 0; border-radius: 999px; background: #4C2944; color: #FFF7F0; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Voir le produit</button>
</sc-if>
<sc-if value="{{showStatus}}" hint-placeholder-val="{{ true }}">
<p style="margin: 12px 0 0 0; font-size: 13px; line-height: 1.4; color: #6E5A6B">[Prototype : 3600000000016 est le lait corps ; un autre code valide mène à « produit inconnu »]</p>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;exemple&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Vide&quot;,&quot;Code reconnu&quot;,&quot;Code inconnu&quot;,&quot;Trop court&quot;,&quot;Chiffre erroné&quot;],&quot;default&quot;:&quot;Vide&quot;,&quot;section&quot;:&quot;Exemple saisi&quot;},&quot;statuts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Statuts des textes (provisoire)&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  componentDidUpdate(prevProps) {
    if (prevProps && prevProps.exemple !== this.props.exemple && this.state && typeof this.state.code === 'string') { this.setState({ code: null, vu: null }); }
  }
  renderVals() {
    // Décision 288 (porteuse, 25/11) : « quand tu retournes, on doit atterir d'où l'on vient […] valable pour tout ». Chaque lien vers
    // une autre planche se note au moment du geste dans la mémoire de session (ficolia-pile : planche de départ, planche d'arrivée,
    // produit et recherche affichés) ; la flèche « Retour » mène à la planche d'où l'on est venu, rouverte sur le même produit et la
    // même recherche, et son libellé suit. Une planche qui s'ouvre sur une sous-étape (signalement, photo…) : sur cet écran d'arrivée,
    // son bouton « Retour » mène aussi là d'où l'on vient ; après un pas dans la planche, il reprend son rôle. Sans note (planche
    // ouverte directement sur le canevas), tout garde sa destination par défaut. La barre d'onglets et les planches E0 (plan,
    // fondations) commencent un parcours neuf.
    try { if (!window.__ficoliaPile) { window.__ficoliaPile = 1; var fxrNom = 'E1-Code.dc.html';
      var fxrLire = function () { try { var p = JSON.parse(sessionStorage.getItem('ficolia-pile') || '[]'); return Array.isArray(p) ? p : []; } catch (e) { return []; } };
      var fxrCible = function () { var p = fxrLire(); for (var i = p.length - 1; i >= 0; i--) if (p[i] && p[i].vers === fxrNom && p[i].de) return { i: i, e: p[i] }; return null; };
      var fxrNomme = function (b, e) { var s = !!e.sel;
        if (/^E4-Signalement/.test(b)) return 'Retour au signalement'; if (/Ingredients/.test(b)) return 'Retour aux ingrédients';
        if (/Verdict|^E[0-9A]-Allaitement/.test(b)) return 'Retour au verdict'; if (/Produit/.test(b)) return 'Retour au produit';
        if (/^E[25]-Recherche/.test(b)) return s ? 'Retour au produit' : 'Retour à la recherche'; if (/^E5-Historique/.test(b)) return s ? 'Retour au produit' : "Retour à l'historique";
        if (/Scan/.test(b)) return 'Retour au scan'; if (/^E6-Menu/.test(b)) return 'Retour au menu'; if (/^E6-BonnesPratiques/.test(b)) return 'Retour aux bonnes pratiques';
        if (/^E6-Methode/.test(b)) return 'Retour à la méthode'; if (/^E2-Liste/.test(b)) return 'Retour à la liste'; return 'Retour'; };
      var fxrVu = function (x) { var r = x.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
      var fxrTitre = function () { var h = [].slice.call(document.querySelectorAll('h1')).filter(fxrVu)[0]; return h ? h.innerText.trim() : ''; };
      var fxrEntree = function () { return typeof window.__fxrH1 === 'string' && fxrTitre() === window.__fxrH1; };
      var fxrFige = function () { try { if (typeof window.__fxrH1 !== 'string') { var t0 = fxrTitre(); if (t0) window.__fxrH1 = t0; }
        var as = document.querySelectorAll('[aria-label^="Retour"]:not([data-fxr-label])'); for (var k = 0; k < as.length; k++) { as[k].setAttribute('data-fxr-label', as[k].getAttribute('aria-label')); if (as[k].tagName === 'A') as[k].setAttribute('data-fxr-href', as[k].getAttribute('href') || ''); } } catch (e) {} };
      var fxrMaj = function () { try { fxrFige(); var c = fxrCible(), as = document.querySelectorAll('[data-fxr-label]');
        for (var k = 0; k < as.length; k++) { var a = as[k], vise = c && (a.tagName === 'A' || fxrEntree());
          if (vise && a.tagName === 'A') a.setAttribute('href', c.e.de);
          a.setAttribute('aria-label', vise && c.e.de !== a.getAttribute('data-fxr-href') ? fxrNomme(c.e.de, c.e) : a.getAttribute('data-fxr-label')); } } catch (e) {} };
      var fxrPart = function (c) { sessionStorage.setItem('ficolia-pile', JSON.stringify(fxrLire().slice(0, c.i)));
        if (c.e.sel || typeof c.e.q === 'string') sessionStorage.setItem('ficolia-ouvrir', JSON.stringify({ board: c.e.de, sel: c.e.sel || null, q: c.e.q, t: Date.now() })); };
      var fxrGeste = function (ev) { try { var t = ev.target && ev.target.closest ? ev.target : null; if (!t) return;
        var b = t.closest('button[aria-label^="Retour"]');
        if (b) { fxrMaj(); var cb = fxrCible(); if (ev.type === 'click' && cb && fxrEntree()) { ev.preventDefault(); ev.stopPropagation(); fxrPart(cb);
            var l = document.createElement('a'); l.setAttribute('href', cb.e.de); l.setAttribute('data-fxr-synth', ''); l.style.display = 'none'; document.body.appendChild(l); l.click(); } return; }
        var a = t.closest('a[href]'); if (!a || a.hasAttribute('data-fxr-synth')) return;
        if (/^Retour/.test(a.getAttribute('aria-label') || '')) { fxrMaj(); var c = fxrCible(); if (ev.type === 'click' && c) fxrPart(c); return; }
        var h = a.getAttribute('href') || ''; if (!/^E[0-9A]-[A-Za-z0-9-]+\.dc\.html$/.test(h)) return;
        var nav = a.closest('nav[aria-label="Navigation principale"]');
        if (/^E0-/.test(fxrNom) || nav) { if (ev.type === 'click') sessionStorage.removeItem('ficolia-pile'); return; }
        var p = fxrLire(), d = p[p.length - 1];
        if (d && d.de === fxrNom && d.vers === h && Date.now() - d.t < 3000) return;
        p.push({ de: fxrNom, vers: h, sel: (window.__fxpVue !== false && window.__fxpSel) || null, q: typeof window.__fxrQ === 'string' ? window.__fxrQ : undefined, t: Date.now() });
        sessionStorage.setItem('ficolia-pile', JSON.stringify(p.slice(-50))); } catch (e) {} };
      window.addEventListener('pointerdown', fxrGeste, true); window.addEventListener('pointerup', fxrGeste, true); window.addEventListener('click', fxrGeste, true);
      window.addEventListener('keydown', fxrMaj, true); window.addEventListener('focusin', fxrMaj, true);
      setTimeout(fxrMaj, 0); setTimeout(fxrMaj, 600); } } catch (e) {}

    // Codes-barres des produits : EAN-8, UPC-A (12) et EAN-13 ; le dernier chiffre est une clé de contrôle.
    var EX = { 'Vide': ['', false], 'Code reconnu': ['3600000000016', false], 'Code inconnu': ['3760000000024', false], 'Trop court': ['36000000016', true], 'Chiffre erroné': ['3600000000019', true] };
    var ex = EX[this.props.exemple] || EX['Vide'];
    var st = this.state || {};
    var self = this;
    var code = typeof st.code === 'string' ? st.code : ex[0];
    var vu = typeof st.vu === 'boolean' ? st.vu : ex[1];
    var brut = code.replace(/[\s-]/g, '');
    var chiffres = /^[0-9]*$/.test(brut);
    var n = brut.length;
    var cle = function (d) { var t = 0; for (var k = d.length - 2, w = 3; k >= 0; k--, w = 4 - w) t += +d[k] * w; return (10 - t % 10) % 10 === +d[d.length - 1]; };
    var bonneLongueur = n === 8 || n === 12 || n === 13;
    var valide = chiffres && bonneLongueur && cle(brut);
    var msg = '';
    if (!chiffres) msg = 'Un code-barres ne contient que des chiffres.';
    else if (n === 0) msg = 'Saisissez les chiffres imprimés sous le code-barres.';
    else if (!bonneLongueur) msg = 'Un code-barres compte 8, 12 ou 13 chiffres. Vous en avez saisi ' + n + '.';
    else if (!valide) msg = 'Ce code ne correspond à aucun code-barres valide. Vérifiez chaque chiffre.';
    var montrer = vu && !valide;
    return {
      code: code,
      onCode: function (ev) { self.setState({ code: String(ev.target.value).slice(0, 20), vu: false }); },
      compte: n > 0 && chiffres ? ' ' + n + (n > 1 ? ' chiffres saisis.' : ' chiffre saisi.') : '',
      erreur: montrer,
      message: msg,
      invalide: montrer ? 'true' : 'false',
      bord: montrer ? '2px solid #4C2944' : '1px solid #6E5A6B',
      connu: valide && brut === '3600000000016',
      inconnu: valide && brut !== '3600000000016',
      aVerifier: !valide,
      verifier: function () { self.setState({ code: code, vu: true }); },
      showStatus: this.props.statuts !== false
    };
  }
}
</script>


</body></html>
